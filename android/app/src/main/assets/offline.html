<html lang="ar" dir="rtl">
<head>

</head>
<body>
  <div class="box">
    <div class="ic">📡</div>
    <h1>مفيش إنترنت</h1>

    <button onclick="location.href='https://egypt-shortdrama.top/'">حاول تاني</button>
  </div>

</html>
